name: Deploy Firebase Functions

on:
  push:
    branches: [ main ]
    paths:
      - 'functions/**'

jobs:
  deploy_functions:
    name: Build & Deploy Cloud Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Install & Build Functions
        run: |
          cd functions
          npm install
          npm run build
