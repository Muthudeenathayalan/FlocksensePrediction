<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FlockSense - Smart Poultry Management & Prediction Platform">

  <!-- Cache bust meta tags -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FlockSense">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>FlockSense - Poultry Prediction & Management</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Invalidate stale caches to ensure latest release runs immediately
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js?v=2" async></script>
</body>
</html>
